version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  fraud-service:
    build:
      context: .
      dockerfile: fraud_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongo:27017
    depends_on:
      - mongo

  orders-service:
    build:
      context: .
      dockerfile: orders_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - FRAUD_SERVICE_URL=http://fraud-service:8001
    depends_on:
      - mongo
      - fraud-service
